# Run `pre-commit install` after `make install` to enable these hooks on commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: ["types-PyYAML"]

  # Project-specific gate: every SKILL.md must satisfy the agentskills.io spec.
  - repo: local
    hooks:
      - id: agentkit-validate
        name: Validate Agent Skills (agentkit validate)
        entry: agentkit validate
        language: system
        pass_filenames: false
        files: ^skills/
