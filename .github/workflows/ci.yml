name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint - Type - Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,skills]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Pytest + coverage
        run: pytest --cov=agentkit --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("coverage.xml").getroot()
              rate = float(root.attrib["line-rate"]) * 100
              print(f"### Coverage (py${{ matrix.python-version }}): {rate:.1f}%")
          except Exception as exc:  # pragma: no cover
              print(f"Coverage summary unavailable: {exc}")
          PY

  diagrams:
    name: Render diagrams (Mermaid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install agentkit + mermaid-cli
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          npm install -g @mermaid-js/mermaid-cli

      - name: Render all diagrams (fails on broken Mermaid)
        run: agentkit diagrams
