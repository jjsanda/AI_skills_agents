[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentkit"
version = "0.1.0"
description = "Command-line tool and library for AI Agent Skills and subagents: discover, validate against the SKILL.md spec, and run a tool-using agent loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Josef Sanda", email = "pepek.svanda@gmail.com" }]
keywords = ["ai", "agents", "agent-skills", "subagents", "llm", "anthropic", "claude", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
# Heavy, science-stack dependencies used only by the skill scripts (not the runtime).
skills = ["pdfplumber>=0.11", "pandas>=2.0", "matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "pre-commit>=3.8",
]

[project.scripts]
agentkit = "agentkit.cli:app"

[project.urls]
Homepage = "https://github.com/jjsanda/agentkit"
Repository = "https://github.com/jjsanda/agentkit"
Issues = "https://github.com/jjsanda/agentkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs/diagrams/exported"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# asserts are expected in tests
"tests/**" = ["S101"]
"skills/**/tests/**" = ["S101"]

# ---------------------------------------------------------------------------
# mypy: strict typing on the runtime package
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/agentkit"]
warn_unused_configs = true

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "skills"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["agentkit"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
